name: Fetch Aviva Pension Prices

on:
  schedule:
    # 6:20am UTC Mon–Fri (5 min after the Vercel cron, as a reliable backup)
    - cron: "20 6 * * 1-5"
  workflow_dispatch: # allow manual trigger from the GitHub Actions tab

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch and store Aviva fund prices
        run: |
          node - << 'EOF'
          const MS_TOKENS = ["klr5zyak8x", "9vehuxllxs", "bzxpplv0mi"];
          const SUPABASE_URL    = process.env.SUPABASE_URL;
          const ANON_KEY        = process.env.SUPABASE_ANON_KEY;
          const WRITER_SECRET   = process.env.PENSION_WRITER_SECRET;
          const today   = new Date().toISOString().slice(0, 10);
          const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

          // Morningstar COMPACTJSON returns [[timestamp_ms, price], ...] — a flat array of pairs.
          // Earlier code expected TimeSeries.Security[0].HistoryDetail (object format) which was wrong.
          function parsePrice(json) {
            try {
              // COMPACTJSON array format: [[ts, price], [ts, price], ...]
              if (Array.isArray(json)) {
                if (!json.length) return null;
                const last = json[json.length - 1];
                const val = parseFloat(last?.[1] ?? "");
                if (isNaN(val) || val <= 0) return null;
                return val > 10 ? val / 100 : val; // pence -> pounds if needed
              }
              // Legacy object format fallback
              const history = json?.TimeSeries?.Security?.[0]?.HistoryDetail;
              if (!Array.isArray(history) || !history.length) return null;
              const val = parseFloat(history[history.length - 1]?.Value ?? "");
              if (isNaN(val) || val <= 0) return null;
              return val > 10 ? val / 100 : val;
            } catch { return null; }
          }

          async function fetchMorningstar(msId, label) {
            for (const token of MS_TOKENS) {
              const url = `https://lt.morningstar.com/api/rest.svc/timeseries_price/${token}` +
                `?id=${msId}&currencyId=GBP&idtype=Morningstar&frequency=daily` +
                `&startDate=${weekAgo}&outputType=COMPACTJSON`;
              try {
                const res = await fetch(url, {
                  headers: {
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
                    "Referer": "https://www.morningstar.co.uk/",
                    "Origin": "https://www.morningstar.co.uk",
                    "Accept": "application/json, text/plain, */*",
                    "Accept-Language": "en-GB,en;q=0.9",
                  },
                  signal: AbortSignal.timeout(15000),
                });
                const text = await res.text();
                console.log(`  [${label}] token ${token}: HTTP ${res.status}, body: ${text.slice(0, 80)}`);
                if (!res.ok) continue;
                let json;
                try { json = JSON.parse(text); } catch { continue; }
                const price = parsePrice(json);
                if (price !== null) return { price, source: `morningstar:${token}` };
              } catch (e) {
                console.log(`  [${label}] token ${token}: ${e.message}`);
              }
            }
            return null;
          }

          async function fetchYahoo(ticker, label) {
            try {
              const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=5d`;
              const res = await fetch(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
                  "Accept": "application/json",
                },
                signal: AbortSignal.timeout(10000),
              });
              if (!res.ok) { console.log(`  [${label}] Yahoo HTTP ${res.status}`); return null; }
              const data = await res.json();
              const meta = data?.chart?.result?.[0]?.meta;
              const price = meta?.regularMarketPrice;
              if (typeof price !== "number" || price <= 0) return null;
              const gbpPrice = (meta?.currency === "GBp" || price > 10) ? price / 100 : price;
              console.log(`  [${label}] Yahoo ${ticker}: £${gbpPrice}`);
              return { price: gbpPrice, source: `yahoo:${ticker}` };
            } catch (e) {
              console.log(`  [${label}] Yahoo error: ${e.message}`);
              return null;
            }
          }

          // Use ?on_conflict=isin,price_date so PostgREST knows which columns to use
          // for the duplicate resolution — without it, resolution=merge-duplicates has
          // no conflict key and the insert fails with a 23505 unique violation.
          // Calls the narrow ingest_pension_price() Postgres function (migration 239).
          // Uses the anon key + a pre-shared PENSION_WRITER_SECRET — the
          // service role key is no longer needed in this workflow.
          async function upsert(isin, price, source) {
            const url = `${SUPABASE_URL}/rest/v1/rpc/ingest_pension_price`;
            const res = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${ANON_KEY}`,
                "apikey": ANON_KEY,
              },
              body: JSON.stringify({
                p_isin:       isin,
                p_price:      price,
                p_price_date: today,
                p_source:     source,
                p_secret:     WRITER_SECRET,
              }),
            });
            if (!res.ok) {
              const err = await res.text();
              console.error(`  upsert failed: ${err}`);
              process.exitCode = 1;
            } else {
              console.log(`  stored £${price.toFixed(4)} for ${isin} (${source})`);
            }
          }

          (async () => {
            // Fund 1: GB00BVRZG281 — try Morningstar first, fall back to Yahoo
            console.log(`\nGB00BVRZG281 (Multi-Asset Plus IV 9):`);
            let r1 = await fetchMorningstar("F00000VBU2", "BVRZG281");
            if (!r1) r1 = await fetchYahoo("0P00015CT0.L", "BVRZG281");
            if (r1) await upsert("GB00BVRZG281", r1.price, r1.source);
            else console.log("  all sources failed");

            // Fund 2: GB00BRDCMX84 — Morningstar returns prices via Azure IPs
            console.log(`\nGB00BRDCMX84 (Universal 2035 Retirement S14):`);
            let r2 = await fetchMorningstar("VAUSA0P5GL", "BRDCMX84");
            if (!r2) console.log("  all sources failed -- DB retains last known price");
            else await upsert("GB00BRDCMX84", r2.price, r2.source);

            console.log("\nDone.");
          })();
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PENSION_WRITER_SECRET: ${{ secrets.PENSION_WRITER_SECRET }}

name: Fetch Aviva Pension Prices

on:
  schedule:
    # 6:20am UTC Mon–Fri (5 min after the Vercel cron, as a reliable backup)
    - cron: "20 6 * * 1-5"
  workflow_dispatch: # allow manual trigger from the GitHub Actions tab

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch and store Aviva fund prices
        run: |
          node - << 'EOF'
          const MS_TOKENS = ["klr5zyak8x", "9vehuxllxs", "bzxpplv0mi"];
          const FUNDS = [
            { isin: "GB00BVRZG281", msId: "F00000VBU2" },
            { isin: "GB00BRDCMX84", msId: "VAUSA0P5GL" },
          ];
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SERVICE_KEY  = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const today   = new Date().toISOString().slice(0, 10);
          const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

          function parsePrice(json) {
            try {
              const history = json?.TimeSeries?.Security?.[0]?.HistoryDetail;
              if (!Array.isArray(history) || !history.length) return null;
              const val = parseFloat(history[history.length - 1]?.Value ?? "");
              if (isNaN(val) || val <= 0) return null;
              return val > 10 ? val / 100 : val;
            } catch { return null; }
          }

          async function fetchMorningstar(msId) {
            for (const token of MS_TOKENS) {
              const url = `https://lt.morningstar.com/api/rest.svc/timeseries_price/${token}` +
                `?id=${msId}&currencyId=GBP&idtype=Morningstar&frequency=daily` +
                `&startDate=${weekAgo}&outputType=COMPACTJSON`;
              try {
                const res = await fetch(url, {
                  headers: {
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
                    "Referer": "https://www.morningstar.co.uk/",
                    "Origin": "https://www.morningstar.co.uk",
                    "Accept": "application/json, text/plain, */*",
                    "Accept-Language": "en-GB,en;q=0.9",
                  },
                  signal: AbortSignal.timeout(15000),
                });
                if (!res.ok) { console.log(`  token ${token}: HTTP ${res.status}`); continue; }
                const json = await res.json();
                const price = parsePrice(json);
                if (price !== null) return { price, token };
                console.log(`  token ${token}: no price in response`);
              } catch (e) {
                console.log(`  token ${token}: ${e.message}`);
              }
            }
            return null;
          }

          async function upsert(isin, price, source) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/pension_fund_prices`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${SERVICE_KEY}`,
                "apikey": SERVICE_KEY,
                "Prefer": "resolution=merge-duplicates",
              },
              body: JSON.stringify({ isin, price_date: today, price_gbp: price, source }),
            });
            if (!res.ok) {
              const err = await res.text();
              console.error(`  upsert failed: ${err}`);
              process.exitCode = 1;
            } else {
              console.log(`  stored £${price.toFixed(4)} for ${isin} (${source})`);
            }
          }

          (async () => {
            for (const { isin, msId } of FUNDS) {
              console.log(`Fetching ${isin} (Morningstar: ${msId})...`);
              const result = await fetchMorningstar(msId);
              if (result) {
                await upsert(isin, result.price, `morningstar:${result.token}`);
              } else {
                console.log(`  all tokens failed, DB retains last price`);
              }
            }
            console.log("Done.");
          })();
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
